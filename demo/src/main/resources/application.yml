spring:
  application:
    name: sports-analytics-engine
  datasource:
    url: jdbc:h2:mem:sportsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.example.demo: INFO
